# Modes: dry_run, paper, live_monitor, live. Paper remains the safe default.
mode: "paper"

account:
  balance_usdc: 100.0 # Paper account reference. Current $3 window cap is 3% of balance.

bot:
  name: "aries"
  symbol: "BTCUSDT"
  interval_seconds: 300
  decision_interval_seconds: 1
  timezone: "UTC"

binance:
  symbol: "btcusdt"
  websocket_url: "wss://stream.binance.com:9443/stream?streams=btcusdt@trade/btcusdt@bookTicker"
  ma_fast: 7
  ma_mid: 25
  ma_slow: 69
  volume_ma_fast: 5
  volume_ma_slow: 10
  price_bar_seconds: 1
  max_state_age_seconds: 3

polymarket:
  gamma_base_url: "https://gamma-api.polymarket.com"
  websocket_url: "wss://ws-subscriptions-clob.polymarket.com/ws/market"
  expected_slug_template: "btc-updown-5m-{window_start_ts}"
  collect_before_open_seconds: 15
  wait_after_open_seconds: 8
  max_quote_age_seconds: 3
  market_refresh_seconds: 10
  allow_target_from_first_seen_after_open: true
  max_target_set_delay_seconds: 3

probability:
  noise_band_usd: 10.0
  distance_bps_scale: 10.0
  velocity_bps_scale: 5.0
  slope_bps_scale: 3.0
  volume_spike_scale: 0.75
  imbalance_scale: 0.35
  distance_weight: 1.0
  ma_weight: 0.75
  velocity_weight: 0.35
  slope_weight: 0.50
  volume_weight: 0.35
  imbalance_weight: 0.45
  persistence_weight: 0.25
  clamp_min: 0.01
  clamp_max: 0.99

edge:
  min_edge: 0.07 # Keep conservative until probability calibration has enough settled windows.
  strong_edge: 0.12
  min_confidence: 0.10
  strong_confidence: 0.50
  max_spread: 0.06

entry:
  early_min_edge: 0.12
  early_min_confidence: 0.50
  force_best_side_after_preferred: false # Live run: forced entries lost $45.82; require real edge/confidence.

# Optional directional model for adding once to an existing dominant side.
# This paper-test profile keeps the core trend/edge gates while ignoring noisy
# one-second volume and order-book agreement. It never bypasses stale quotes,
# minimum shares, lock/repair priority, or the hard per-window risk caps.
high_conviction_same_side:
  enabled: false # Live run: same-side adds lost $20.49; re-enable only after live calibration.
  min_probability: 0.75 # Side probability, e.g. p_up >= 0.78.
  min_confidence: 0.55 # Requires roughly 77.5%+ directional probability.
  min_edge: 0.015
  min_net_edge: 0.01
  max_ask: 0.88
  require_price_on_target_side: true
  min_distance_bps: 3.0
  require_ma_alignment: true
  min_fast_slope_bps: 0.00
  min_mid_slope_bps: -0.05 # Permit a small mid-MA pause during an aligned trend.
  min_velocity_5s_bps: -0.25 # Permit a small pullback while the MA trend remains aligned.
  min_persistence_seconds: 8
  require_volume_spike: false # One-second volume is too noisy to require for the paper trial.
  min_volume_spike: 1.00
  require_orderbook_alignment: false # Keep as a diagnostic; do not make it a hard gate yet.
  min_orderbook_imbalance: 0.05
  min_seconds_since_open: 25
  max_seconds_since_open: 150 # Supplied paper run was negative after this point.
  min_seconds_after_first_entry: 10
  min_seconds_remaining: 45
  max_adds_per_window: 2
  ladder_usdc: [2.0, 3.0, 5.0]
  start_ladder_step: 0
  max_ladder_step: 3
  scale_ladder_with_account_balance: false # Keep the configured conviction clips exact.
  allow_allowed_notional_below_ladder: true # Use the safe Kelly allowance if it is just below the smallest clip.
  min_allowed_notional_fallback_usdc: 1.0
  fractional_kelly: 0.20
  max_window_notional_usdc: 7.0
  max_window_loss_usdc: 7.0
  scale_risk_caps_with_account_balance: false # Keep $7 as a hard cap.

sizing:
  ladder_usdc: [1.0, 2.0, 3.0]
  research_ladder_usdc: [5.0, 10.0, 20.0, 50.0, 70.0, 100.0, 150.0, 200.0]
  use_research_ladder: false
  first_entry_step: 0
  repair_start_step: 0
  same_side_start_step: 1
  max_ladder_step_per_window: 2
  min_order_shares: 1.0
  min_order_notional_usdc: 1.0
  allow_bump_to_min_shares: false

# Optional research-informed account growth layer. It still chooses from the
# sizing ladder; it does not bypass strategy, quote, timing, or risk checks.
growth_sizing:
  enabled: true
  fractional_kelly: 0.10 # Conservative because Aries probabilities are not yet calibrated.
  apply_kelly_to_repairs: false # Repairs use exact PnL-gap target plus risk limits.
  use_growth_score_for_first_entry: true
  scale_with_account_balance: true
  min_account_scale: 0.25
  max_account_scale: 3.0
  safety_buffer_pp: 0.002 # Added to PM ask for sizing diagnostics only.
  worst_case_weight: 0.50
  inventory_weight: 0.10
  order_cost_weight: 0.01

risk:
  max_window_notional_usdc: 3.0 # Base cap; scales with settled balance when growth sizing is enabled.
  max_window_loss_usdc: 2.0 # Base loss cap; scales with settled balance when growth sizing is enabled.
  max_orders_per_window: 10
  max_same_side_adds: 0
  min_shape_improvement_usdc: 0.01
  allow_repair_at_small_negative_edge: false
  max_repair_negative_edge: 0.02
  stop_when_locked: false
  allow_post_lock_adds: true

timing:
  require_clean_window: true
  first_entry_start_seconds: 30 # Supplied live run was strongly negative during the first 30 seconds.
  preferred_first_entry_seconds: 18
  repair_start_after_first_entry_seconds: 24
  preferred_repair_after_first_entry_seconds: 38
  repair_deadline_seconds_remaining: 60
  endgame_seconds_remaining: 30
  min_seconds_remaining: 20

logging:
  decisions_log: "logs/decisions.jsonl"
  fills_log: "logs/fills.jsonl"
  console: true

database:
  path: "aries.db"

# Routine monitor snapshots are disposable and sampled. Orders, fills, settled
# window results, and realized PnL are always retained in SQLite.
storage:
  max_decisions_log_mb: 50
  max_decisions_log_rows: 10000
  max_fills_log_mb: 50
  max_database_mb: 50
  decision_sample_seconds: 15
  decision_rows_to_keep: 5000
  maintenance_interval_seconds: 60

paper:
  enabled: true
  immediate_fill: true
  slippage_bps: 0
  fees_bps: 0

reports:
  enabled: true
  output_dir: "reports"

# Advisory only. Recommendations must stay profitable in chronological training
# and validation segments before they appear on the terminal/report.
optimization:
  enabled: true
  source: "auto" # Uses settled live matched orders in live mode; otherwise paper fills.
  refresh_seconds: 60
  min_settled_windows: 100
  min_samples_per_bucket: 20
  min_calibration_samples: 100
  validation_fraction: 0.30
  time_bucket_seconds: 30
  price_bucket_width: 0.10

validation:
  enabled: true
  run_on_shutdown: true
  fail_fast: false

live:
  monitor_enabled: false # Set true to show authenticated account state while paper trading.
  enabled: false
  allow_real_orders: false
  confirm_real_orders: "" # Live mode also requires: I_UNDERSTAND_REAL_ORDERS
  private_key_env: "POLYMARKET_PRIVATE_KEY"
  wallet_env: "POLYMARKET_DEPOSIT_WALLET"
  api_key_env: "POLYMARKET_API_KEY"
  api_secret_env: "POLYMARKET_API_SECRET"
  api_passphrase_env: "POLYMARKET_API_PASSPHRASE"
  account_refresh_seconds: 5
  max_account_state_age_seconds: 10
  order_cooldown_seconds: 3
  rejection_backoff_seconds: 30 # Avoid repeating a rejected CLOB request every cycle.
  min_order_shares: 5.0 # Observed CLOB minimum; live candidates below this are blocked before submission.
  max_orders_per_window: 3 # Independent live hard limit, even if strategy risk is configured higher.
  max_window_notional_usdc: 7.0 # Independent live hard spend limit reconstructed from matched audits.
  minimum_collateral_balance_usdc: 10.0 # Halt new live orders before a small account is exhausted.
  max_session_drawdown_fraction: 0.15 # Halt after a 15% collateral drawdown from process start.
  halt_on_balance_error: true # Require restart/review after a CLOB balance or allowance error.
  collateral_decimals: 6
  post_only: false # Must remain false for a marketable limit BUY at the selected ask.
  cancel_unmatched_orders: true # Cancel a selected-ask order if it rests instead of filling.
